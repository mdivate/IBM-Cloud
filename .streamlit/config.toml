# .streamlit/config.toml
# Streamlit Cloud + IBM Cloud Code Engine compatible configuration

[server]
# No port set here — Streamlit Cloud manages the port automatically.
# For IBM Code Engine local Docker: override via CLI flag --server.port=8080
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
# Writing Pulse — IBM Carbon design language
primaryColor        = "#0f62fe"
backgroundColor     = "#ffffff"
secondaryBackgroundColor = "#f4f4f4"
textColor           = "#161616"
font                = "sans serif"

[logger]
level = "warning"
